  <style>

*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.hidden{display:none!important}
.app-shell{height:100vh;display:flex;flex-direction:column;min-width:0;overflow:hidden}.topbar{height:74px;display:grid;grid-template-columns:minmax(210px,260px) minmax(0,1fr) auto;align-items:center;padding:0 20px;border-bottom:1px solid color-mix(in srgb,var(--gold) 35%,transparent);background:color-mix(in srgb,var(--panel) 96%,transparent);position:relative;z-index:60}.brand-block{display:flex;gap:12px;align-items:center}.brand-emblem{width:40px;height:40px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-family:Georgia,serif}.brand-title{font:700 20px/1 Georgia,serif}.brand-sub{font:12px/1.2 Georgia,serif;color:var(--muted);margin-top:5px}.topnav{display:flex;justify-content:center;gap:7px}.nav-btn,.pill-btn,.outline-btn,.side-btn,.primary-btn{border:0;background:transparent;color:var(--ink);cursor:pointer;border-radius:12px;transition:.16s ease}.nav-btn{padding:10px 15px;font-family:Georgia,serif}.nav-btn.active,.nav-btn:hover{background:color-mix(in srgb,var(--gold) 17%,transparent);color:var(--gold)}.top-actions{display:flex;gap:9px;align-items:center}.global-search{height:38px;width:210px;border:1px solid color-mix(in srgb,var(--gold) 38%,transparent);border-radius:12px;background:var(--paper);display:flex;align-items:center;padding:0 10px;gap:7px}.global-search input{width:100%;border:0;outline:0;background:transparent;color:var(--ink)}.pill-btn{border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);background:var(--paper);padding:9px 12px}.theme-picker{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.theme-picker select{border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);background:var(--paper);color:var(--ink);padding:9px 10px;border-radius:12px;outline:none}
.workspace{flex:1;min-height:0;display:grid;grid-template-columns:220px minmax(0,1fr) 300px;gap:0;position:relative;overflow:hidden}.left-panel,.right-panel{background:color-mix(in srgb,var(--panel) 97%,transparent);padding:20px 16px;overflow:auto}.left-panel{border-right:1px solid color-mix(in srgb,var(--gold) 28%,transparent)}.right-panel{border-left:1px solid color-mix(in srgb,var(--gold) 28%,transparent)}.section-kicker{text-transform:uppercase;letter-spacing:.12em;color:var(--gold);font-size:10px;margin:0 0 10px}.side-section{padding-top:16px;margin-top:16px;border-top:1px solid color-mix(in srgb,var(--gold) 25%,transparent)}.side-btn{width:100%;text-align:left;padding:10px 11px;margin:2px 0}.side-btn.active,.side-btn:hover{background:color-mix(in srgb,var(--gold) 14%,transparent)}.field{width:100%;border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);background:var(--paper);color:var(--ink);border-radius:10px;padding:10px 11px;outline:none}.zoom-row{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:7px;margin-bottom:8px}.zoom-row button{height:38px;border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);background:var(--paper);color:var(--ink);border-radius:10px;cursor:pointer}.zoom-row span{text-align:center;color:var(--muted);font-size:12px}.primary-btn{width:100%;padding:12px 14px;background:var(--ink);color:var(--accentText);font-weight:700;box-shadow:var(--shadow)}.branch-list{display:flex;flex-direction:column;gap:4px}.branch-item{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;cursor:pointer}.branch-item:hover{background:color-mix(in srgb,var(--gold) 12%,transparent)}.branch-count{font-size:11px;color:var(--muted)}.legend{margin-top:20px;padding-top:15px;border-top:1px solid color-mix(in srgb,var(--gold) 25%,transparent);font-size:10px;color:var(--muted);display:grid;gap:8px}.line-solid,.line-dash{display:inline-block;width:26px;border-top:2px solid var(--line);margin-right:6px;vertical-align:middle}.line-dash{border-top-style:dashed}.branch-mark{color:var(--gold);margin-right:8px}
.main-stage{min-width:0;display:flex;flex-direction:column;background:var(--bg);position:relative}.stage-head{height:66px;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid color-mix(in srgb,var(--gold) 23%,transparent);background:color-mix(in srgb,var(--panel) 58%,transparent);position:relative;z-index:10}.stage-title{font:700 22px/1 Georgia,serif}.stage-sub{font-size:11px;color:var(--muted);margin-top:5px}.outline-btn{padding:10px 14px;border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);background:var(--paper)}.tree-viewport{position:relative;flex:1;overflow:hidden;cursor:grab;background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 28%,transparent),transparent 24%),radial-gradient(circle at 50% 62%,color-mix(in srgb,var(--gold) 7%,transparent),transparent 56%),var(--bg);user-select:none;-webkit-user-select:none;touch-action:none}.tree-viewport.dragging{cursor:grabbing}.tree-world{position:absolute;transform-origin:0 0;user-select:none;-webkit-user-select:none}.tree-art,.relation-svg,.person-layer{position:absolute;inset:0;user-select:none;-webkit-user-select:none}.tree-art{pointer-events:none;opacity:1}.relation-svg{pointer-events:none;overflow:visible}.person-card{position:absolute;width:258px;min-height:112px;border-radius:14px;background:color-mix(in srgb,var(--paper) 98%,transparent);border:1px solid color-mix(in srgb,var(--gold) 50%,transparent);padding:13px 14px 12px 96px;box-shadow:0 7px 18px rgba(66,47,24,.12);cursor:pointer;transition:border-color .16s ease,box-shadow .16s ease,transform .16s ease;user-select:none;-webkit-user-select:none}.person-card:hover{border-color:var(--gold);box-shadow:0 11px 24px rgba(66,47,24,.17);transform:translateY(-1px)}.person-card.selected{border:2px solid var(--gold);background:color-mix(in srgb,var(--paper) 88%,var(--gold) 12%);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 15%,transparent),0 12px 28px rgba(66,47,24,.18)}.portrait{position:absolute;left:12px;top:12px;width:70px;height:82px;border-radius:12px;border:2px solid color-mix(in srgb,var(--gold) 72%,transparent);outline:1px solid color-mix(in srgb,var(--gold) 24%,transparent);outline-offset:3px;background:linear-gradient(145deg,color-mix(in srgb,var(--tree) 26%,var(--paper)),var(--paper));display:grid;place-items:center;color:var(--gold);font:700 18px Georgia,serif;overflow:hidden;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--paper) 75%,transparent)}.portrait img{width:100%;height:100%;object-fit:cover;filter:saturate(.72) sepia(.12)}.person-name{font:700 15px/1.16 Georgia,serif;padding-right:18px}.person-alt{font:italic 10.5px/1.25 Georgia,serif;color:var(--muted);margin-top:3px}.person-dates{font:11px/1.3 Georgia,serif;color:var(--ink);margin-top:7px}.person-age{font:italic 10.5px/1.25 Georgia,serif;color:var(--muted);margin-top:3px}.branch-icon{position:absolute;right:7px;top:6px;color:var(--gold);font-size:16px;line-height:1;border:0;background:transparent;padding:3px;cursor:pointer;border-radius:50%}.branch-icon:hover{background:color-mix(in srgb,var(--gold) 12%,transparent)}.branch-open{display:inline-block;margin-top:7px;padding:4px 7px;border:1px solid color-mix(in srgb,var(--gold) 24%,transparent);border-radius:999px;background:color-mix(in srgb,var(--gold) 8%,transparent);color:var(--gold);font-size:9.5px;cursor:pointer;font-weight:700}.branch-open:hover{background:color-mix(in srgb,var(--gold) 15%,transparent)}.relation-line{fill:none;stroke:var(--line);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;opacity:.82}.relation-line.partner{stroke:var(--gold);stroke-width:2.6;opacity:.9}.relation-line.ended{stroke-dasharray:10 8}.tree-label{fill:var(--muted);font:12px Georgia,serif}.empty-view{padding:40px;color:var(--muted)}
.profile-empty{text-align:center;padding:80px 15px;color:var(--muted)}.empty-portrait{width:92px;height:112px;margin:0 auto 18px;border:3px double var(--gold);border-radius:45% 45% 40% 40%;display:grid;place-items:center;font-size:30px;color:var(--gold)}.profile-content{display:block}.profile-hero{display:grid;grid-template-columns:94px 1fr;gap:13px;align-items:start}.profile-photo{width:94px;height:118px;border-radius:42% 42% 35% 35%;border:4px double var(--gold);background:linear-gradient(145deg,color-mix(in srgb,var(--tree) 30%,var(--paper)),var(--paper));display:grid;place-items:center;color:var(--gold);font:700 24px Georgia,serif;overflow:hidden}.profile-photo img{width:100%;height:100%;object-fit:cover}.profile-name{font:700 22px/1.05 Georgia,serif}.profile-dates{color:var(--muted);font-size:12px;margin-top:8px}.profile-place{font-size:12px;color:var(--muted);margin-top:5px}.profile-bio{font:14px/1.5 Georgia,serif;margin:15px 0}.tabs{display:flex;border-bottom:1px solid color-mix(in srgb,var(--gold) 30%,transparent);margin:14px 0 6px}.tab{border:0;background:transparent;color:var(--muted);padding:9px 10px;cursor:pointer}.tab.active{color:var(--gold);border-bottom:2px solid var(--gold)}.profile-section{padding:12px 0;border-bottom:1px solid color-mix(in srgb,var(--gold) 20%,transparent)}.profile-section h4{font:700 12px Georgia,serif;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;margin:0 0 8px}.mini-person{display:flex;align-items:center;gap:8px;padding:7px 0}.mini-avatar{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font:700 11px Georgia,serif;background:var(--paper)}.mini-name{font-size:12px}.profile-edit{width:100%;margin-top:15px;border:0;border-radius:11px;padding:12px;background:var(--ink);color:var(--accentText);font-weight:700;cursor:pointer}
.context-menu{position:fixed;z-index:200;background:var(--paper);border:1px solid color-mix(in srgb,var(--gold) 58%,transparent);border-radius:13px;box-shadow:var(--shadow);padding:7px;width:220px}.context-item{padding:9px 10px;border-radius:8px;font-size:12px;cursor:pointer}.context-item:hover{background:color-mix(in srgb,var(--gold) 14%,transparent)}.context-sep{height:1px;background:color-mix(in srgb,var(--gold) 24%,transparent);margin:5px}.submenu{position:absolute;left:100%;top:70px;margin-left:6px;background:var(--paper);border:1px solid color-mix(in srgb,var(--gold) 58%,transparent);border-radius:13px;box-shadow:var(--shadow);padding:6px;width:160px}.submenu .context-item{padding:8px 9px}
.modal-backdrop{position:fixed;z-index:300;inset:0;background:rgba(18,14,10,.38);display:grid;place-items:center;padding:30px}.modal{width:min(760px,92vw);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid color-mix(in srgb,var(--gold) 60%,transparent);border-radius:18px;box-shadow:0 28px 80px rgba(0,0,0,.35)}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid color-mix(in srgb,var(--gold) 25%,transparent)}.modal-title{font:700 23px Georgia,serif}.modal-close{border:0;background:transparent;color:var(--ink);font-size:24px;cursor:pointer}.modal-body{padding:20px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.form-group{display:flex;flex-direction:column;gap:6px}.form-group.full{grid-column:1/-1}.form-group label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}.form-group input,.form-group select,.form-group textarea{border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);background:var(--paper);color:var(--ink);border-radius:10px;padding:10px 11px;outline:none}.form-group textarea{min-height:110px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.btn-secondary,.btn-primary,.btn-danger{border:0;border-radius:10px;padding:10px 14px;cursor:pointer}.btn-secondary{background:var(--paper);color:var(--ink);border:1px solid color-mix(in srgb,var(--gold) 32%,transparent)}.btn-primary{background:var(--ink);color:var(--accentText)}.btn-danger{background:var(--danger);color:white}.death-toggle{display:inline-flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;cursor:pointer}.access-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.access-card{border:1px solid color-mix(in srgb,var(--gold) 30%,transparent);border-radius:14px;padding:15px;background:var(--paper)}.access-card h4{font:700 16px Georgia,serif;margin:0 0 6px}.role-badge{display:inline-block;border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:999px;padding:4px 8px;font-size:10px;color:var(--gold)}.toast{position:fixed;z-index:500;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--accentText);padding:11px 15px;border-radius:12px;box-shadow:var(--shadow);font-size:12px}.relation-result{padding:14px;border-radius:12px;background:color-mix(in srgb,var(--gold) 10%,transparent);font:700 17px Georgia,serif}.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.photo-placeholder{aspect-ratio:4/3;border:1px dashed color-mix(in srgb,var(--gold) 45%,transparent);border-radius:12px;display:grid;place-items:center;color:var(--muted);font-size:11px}.upload-box{border:1px dashed color-mix(in srgb,var(--gold) 55%,transparent);border-radius:12px;padding:18px;text-align:center;color:var(--muted)}
@media(max-width:1240px){
  .workspace{grid-template-columns:190px minmax(0,1fr) 270px}
  .left-panel,.right-panel{padding:16px 12px}
  .global-search{display:none}.theme-picker span{display:none}
  .topbar{grid-template-columns:210px minmax(0,1fr) auto;padding:0 14px}
  .nav-btn{padding:9px 10px}
}
@media(max-width:1040px){
  .workspace{grid-template-columns:185px minmax(0,1fr)}
  .right-panel{position:absolute;right:0;top:0;bottom:0;width:min(310px,42vw);z-index:70;box-shadow:-18px 0 38px rgba(45,31,15,.12);background:var(--panel)}
  .main-stage{padding-right:0}
  .brand-title{font-size:17px}.brand-sub{display:none}
  .topbar{grid-template-columns:180px minmax(0,1fr) auto}
  .topnav{justify-content:flex-start;overflow:hidden}
  .nav-btn{padding:8px 8px;font-size:13px}
  .pill-btn{padding:8px 9px}.theme-picker select{max-width:145px}
}
@media(max-width:820px){
  .topbar{height:auto;min-height:72px;grid-template-columns:1fr auto;grid-template-areas:"brand actions" "nav nav";gap:5px;padding:8px 12px}
  .brand-block{grid-area:brand}.top-actions{grid-area:actions}.topnav{grid-area:nav;overflow-x:auto;justify-content:flex-start}
  .workspace{grid-template-columns:165px minmax(0,1fr)}
  .left-panel{padding:14px 10px}.right-panel{width:min(300px,50vw)}
  .stage-head{height:58px;padding:10px 14px}.stage-title{font-size:19px}
}


/* ===== Central tree v5: approved "Тихая роскошь" visual ===== */
.workspace{grid-template-columns:220px minmax(0,1fr)!important}
.workspace.profile-open{grid-template-columns:220px minmax(0,1fr) 330px!important}
.right-panel.hidden{display:none!important}
.right-panel{position:relative;min-width:0}
.profile-close{position:absolute;right:12px;top:10px;z-index:5;width:34px;height:34px;border:0;background:transparent;color:var(--ink);font:400 30px/1 Georgia,serif;cursor:pointer;border-radius:50%}
.profile-close:hover{background:color-mix(in srgb,var(--gold) 12%,transparent)}

.tree-viewport,.tree-viewport *{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}
.tree-viewport{background:linear-gradient(180deg,#f6efe2 0%,#f0e6d5 100%)!important}
body[data-theme="royal"] .tree-viewport{background:radial-gradient(circle at 50% 42%,#1b281f 0%,#09120f 72%)!important}
body[data-theme="archive"] .tree-viewport{background:linear-gradient(180deg,#e8dfd0,#d8cdbb)!important}
.tree-world{isolation:isolate}
.oak-bg{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:fill;opacity:.96;filter:none;pointer-events:none;z-index:0}
body[data-theme="royal"] .oak-bg{opacity:.72;filter:sepia(.42) saturate(.72) brightness(.62) contrast(1.06)}
body[data-theme="archive"] .oak-bg{opacity:.86;filter:sepia(.28) saturate(.74) contrast(.96)}
.relation-svg{z-index:1}.person-layer{z-index:2}

.person-card{width:310px;min-height:136px;border-radius:22px!important;background:linear-gradient(180deg,color-mix(in srgb,var(--paper) 98%,white 2%),color-mix(in srgb,var(--paper) 92%,var(--gold) 8%))!important;border:1px solid color-mix(in srgb,var(--gold) 68%,transparent)!important;padding:17px 18px 15px 122px!important;box-shadow:0 12px 28px rgba(72,48,20,.15)!important;overflow:visible!important}
.person-card:hover{transform:translateY(-2px)!important;box-shadow:0 18px 32px rgba(72,48,20,.19)!important}
.person-card.selected{border:2px solid var(--gold)!important;box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 16%,transparent),0 18px 34px rgba(72,48,20,.2)!important}
.portrait{left:16px!important;top:50%!important;transform:translateY(-50%);width:88px!important;height:108px!important;border-radius:48% 48% 44% 44%!important;border:3px double var(--gold)!important;outline:1px solid color-mix(in srgb,var(--gold) 35%,transparent)!important;outline-offset:4px!important;background:radial-gradient(circle at 50% 34%,#eadbc2 0%,#cdbb99 70%,#b49768 100%)!important;font:700 22px Georgia,serif!important}
.person-name{font:700 18px/1.1 Georgia,serif!important;padding-right:22px!important;letter-spacing:-.01em}
.person-alt{font:italic 12px/1.25 Georgia,serif!important;margin-top:4px!important}
.person-dates{font:13px/1.25 Georgia,serif!important;margin-top:9px!important}
.person-age{font:italic 12px/1.25 Georgia,serif!important;margin-top:3px!important}
.branch-icon{right:10px!important;top:9px!important;font-size:17px!important}
.relation-line{stroke:var(--line)!important;stroke-width:3!important;opacity:.88!important}
.relation-line.partner{stroke:var(--gold)!important;stroke-width:3.4!important}
.relation-line.ended{stroke-dasharray:11 9!important}

.canvas-tools{position:absolute;right:18px;bottom:18px;z-index:30;display:flex;align-items:center;gap:6px;padding:7px;background:color-mix(in srgb,var(--paper) 94%,transparent);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:18px;box-shadow:0 10px 28px rgba(55,37,15,.13);backdrop-filter:blur(6px)}
.canvas-tools button{width:38px;height:38px;border:0;background:transparent;color:var(--ink);border-radius:12px;cursor:pointer;font-size:19px}.canvas-tools button:hover{background:color-mix(in srgb,var(--gold) 13%,transparent)}
.canvas-tools span{min-width:54px;text-align:center;font-size:12px;color:var(--muted)}

.profile-hero{padding-right:28px}.profile-photo{border-radius:48% 48% 44% 44%!important}.profile-name{font-size:24px!important}

@media(max-width:1240px){.workspace{grid-template-columns:190px minmax(0,1fr)!important}.workspace.profile-open{grid-template-columns:190px minmax(0,1fr) 300px!important}}
@media(max-width:1040px){.workspace{grid-template-columns:185px minmax(0,1fr)!important}.workspace.profile-open{grid-template-columns:185px minmax(0,1fr)!important}.right-panel{position:absolute!important;right:0;top:0;bottom:0;width:min(330px,45vw)!important;z-index:70}}


/* TEMP: 30-person density test. Real card design is intentionally not evaluated here. */

.portrait{left:10px!important;width:48px!important;height:60px!important;font-size:13px!important;outline-offset:2px!important}
.person-name{font-size:13px!important;line-height:1.08!important;padding-right:8px!important}
.person-alt{display:none!important}.person-dates{font-size:9px!important;margin-top:5px!important}.person-age{display:none!important}
.branch-icon{display:none!important}
</style>
</head>
<body data-theme="quiet">
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <div class="brand-emblem">♜</div>
        <div><div class="brand-title">Семейный архив</div><div class="brand-sub">Родовое древо</div></div>
      </div>
      <nav class="topnav">
        <button class="nav-btn active" data-view="tree">Древо</button>
        <button class="nav-btn" data-view="people">Люди</button>
        <button class="nav-btn" data-view="stories">Истории</button>
        <button class="nav-btn" data-view="photos">Фото</button>
        <button class="nav-btn" data-view="docs">Документы</button>
      </nav>
      <div class="top-actions">
        <label class="global-search"><span>⌕</span><input id="globalSearch" placeholder="Найти человека…" /></label>
        <button id="accessBtn" class="pill-btn">Семейный доступ</button>
        <label class="theme-picker"><span>Оформление</span><select id="themeSelect"><option value="quiet">Тихая роскошь</option><option value="royal">Королевская династия</option><option value="archive">Семейный архив</option></select></label>
      </div>
    </header>

<script>

const state={people:[],relations:[],events:[],selected:null,theme:localStorage.getItem('family-theme')||'quiet',role:'admin',viewerPersonId:'P053',scale:.62,offset:{x:0,y:0},branch:null,view:'tree',drag:false,last:{x:0,y:0},contextPerson:null};
const api={
 async bootstrap(){try{const r=await fetch('/api/bootstrap');if(r.ok)return await r.json()}catch{}return null},
 async savePerson(person){try{const r=await fetch('/api/people/'+encodeURIComponent(person.id),{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(person)});return r.ok}catch{return false}},

};
function toast(t){const el=$('#toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.add('hidden'),2600)}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function parseDate(v){if(!v)return null;v=String(v).trim();let m;if((m=v.match(/^(\d{4})-(\d{2})-(\d{2})$/)))return new Date(+m[1],+m[2]-1,+m[3]);if((m=v.match(/^(\d{2})\.(\d{2})\.(\d{4})$/)))return new Date(+m[3],+m[2]-1,+m[1]);if((m=v.match(/^(\d{4})$/)))return new Date(+m[1],0,1);return null}
function formatDate(v){if(!v)return '';v=String(v).trim();let m;if((m=v.match(/^(\d{4})-(\d{2})-(\d{2})$/)))return `${m[3]}.${m[2]}.${m[1]}`;return v}
function ageText(p){const raw=String(p.birthDate||'').trim();const b=parseDate(raw);if(!b)return '';const d=p.deathDate?parseDate(p.deathDate):new Date();if(!d)return '';let age=d.getFullYear()-b.getFullYear();const exact=/^(\d{4})-(\d{2})-(\d{2})$/.test(raw)||/^(\d{2})\.(\d{2})\.(\d{4})$/.test(raw);if(exact){const md=d.getMonth()-b.getMonth();if(md<0||(md===0&&d.getDate()<b.getDate()))age--}if(age<0||age>130)return '';const prefix=exact?'':'ок. ';return p.deathDate?`ушёл(а) из жизни в ${prefix}${age} ${ruYears(age)}`:`${prefix}${age} ${ruYears(age)}`}
function ruYears(n){const n10=n%10,n100=n%100;return n10===1&&n100!==11?'год':n10>=2&&n10<=4&&!(n100>=12&&n100<=14)?'года':'лет'}
function initials(name){return name.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'•'}
function birthSurname(p){const t=p.altName||'';let m=t.match(/урожд[её]н(?:ная|ный)\s+([^;,]+)/i);if(m)return m[1].trim();m=t.match(/девичья фамилия[:\s]+([^;,]+)/i);return m?m[1].trim():''}
function lifeDates(p){const b=formatDate(p.birthDate),d=formatDate(p.deathDate);return d?`${b||'дата рождения уточняется'} — ${d}`:b||'дата рождения уточняется'}
function personById(id){return state.people.find(p=>p.id===id)}
function parentRelations(){return state.relations.filter(r=>r.type==='parent')}
function partnerRelations(){return state.relations.filter(r=>r.type==='partner')}
function childrenOf(id){return parentRelations().filter(r=>r.a===id).map(r=>personById(r.b)).filter(Boolean)}
function parentsOf(id){return parentRelations().filter(r=>r.b===id).map(r=>personById(r.a)).filter(Boolean)}
function partnersOf(id){return partnerRelations().filter(r=>r.a===id||r.b===id).map(r=>({rel:r,person:personById(r.a===id?r.b:r.a)})).filter(x=>x.person)}
function branchCounts(){const m=new Map();state.people.forEach(p=>{const b=p.branch||'Без ветви';m.set(b,(m.get(b)||0)+1)});return [...m.entries()].sort((a,b)=>b[1]-a[1])}
function saveLocal(){localStorage.setItem('family-local-data',JSON.stringify({people:state.people,relations:state.relations}))}
function applyTheme(t){state.theme=t;document.body.dataset.theme=t;$('#themeSelect').value=t;localStorage.setItem('family-theme',t)}
const CARD_W=190,CARD_H=92,GEN_GAP=315,CARD_GAP=32;
const BRANCH_ROOTS=[['P004','Ветвь 1'],['P005','Ветвь 2'],['P006','Ветвь 3'],['P007','Ветвь 4'],['P008','Ветвь 5'],['P009','Ветвь 6'],['P010','Ветвь 7']];
function setWorldSize(w,h){const world=$('#treeWorld'),rel=$('#relationSvg'),layer=$('#personLayer');world.style.width=w+'px';world.style.height=h+'px';rel.setAttribute('width',w);rel.setAttribute('height',h);rel.setAttribute('viewBox',`0 0 ${w} ${h}`);layer.style.width=w+'px';layer.style.height=h+'px';state.worldSize={w,h}}
function coreOverviewIds(){return ['P002','P003','P004','P005','P006','P007','P008','P009','P010'].filter(id=>personById(id))}
function descendantsOf(rootId){const ids=new Set([rootId]);const q=[rootId];while(q.length){const id=q.shift();childrenOf(id).forEach(c=>{if(!ids.has(c.id)){ids.add(c.id);q.push(c.id)}})}return ids}
function branchVisiblePeople(rootId){const ids=descendantsOf(rootId);[...ids].forEach(id=>partnersOf(id).forEach(x=>ids.add(x.person.id)));return [...ids].map(personById).filter(Boolean)}
function lineageVisiblePeople(id){const ids=new Set([id]);const q=[id];while(q.length){const cur=q.shift();parentsOf(cur).forEach(p=>{if(!ids.has(p.id)){ids.add(p.id);q.push(p.id)}})};[...ids].forEach(pid=>partnersOf(pid).forEach(x=>ids.add(x.person.id)));return [...ids].map(personById).filter(Boolean)}
function filteredPeople(){return state.people}
function overviewLayout(){const w=2920,h=1643,pos=new Map();pos.set('P002',{x:960,y:150});pos.set('P003',{x:1325,y:150});const kids=BRANCH_ROOTS.map(([id])=>id).filter(id=>personById(id));const step=370,start=(w-((kids.length-1)*step+CARD_W))/2;kids.forEach((id,i)=>pos.set(id,{x:start+i*step,y:570}));return {pos,w,h}}
function generationsFromRoot(rootId,arr){const visible=new Set(arr.map(p=>p.id));const gen=new Map([[rootId,0]]);let changed=true;while(changed){changed=false;for(const r of parentRelations()){if(!visible.has(r.a)||!visible.has(r.b)||!gen.has(r.a))continue;const ng=gen.get(r.a)+1;if(!gen.has(r.b)||gen.get(r.b)<ng){gen.set(r.b,ng);changed=true}}for(const r of partnerRelations()){if(!visible.has(r.a)||!visible.has(r.b))continue;if(gen.has(r.a)&&!gen.has(r.b)){gen.set(r.b,gen.get(r.a));changed=true}else if(gen.has(r.b)&&!gen.has(r.a)){gen.set(r.a,gen.get(r.b));changed=true}}}arr.forEach(p=>{if(!gen.has(p.id))gen.set(p.id,0)});return gen}
function lineageGenerations(arr){const global=new Map();function g(id,seen=new Set()){if(global.has(id))return global.get(id);if(seen.has(id))return 0;seen.add(id);const ps=parentsOf(id).filter(p=>arr.some(x=>x.id===p.id));const val=ps.length?Math.max(...ps.map(p=>g(p.id,new Set(seen))))+1:0;global.set(id,val);return val}arr.forEach(p=>g(p.id));let changed=true;while(changed){changed=false;for(const r of partnerRelations()){const a=global.get(r.a),b=global.get(r.b);if(a!=null&&b!=null&&a!==b){const m=Math.max(a,b);global.set(r.a,m);global.set(r.b,m);changed=true}}}return global}
function clusterGeneration(ps){const ids=new Set(ps.map(p=>p.id)),seen=new Set(),clusters=[];for(const p of ps){if(seen.has(p.id))continue;const mates=partnersOf(p.id).map(x=>x.person).filter(q=>ids.has(q.id)&&!seen.has(q.id));const cluster=[p,...mates];cluster.forEach(x=>seen.add(x.id));clusters.push(cluster)}return clusters}

function cousinWord(deg,gender){const words={1:gender==='female'?'двоюродная':'двоюродный',2:gender==='female'?'троюродная':'троюродный',3:gender==='female'?'четвероюродная':'четвероюродный',4:gender==='female'?'пятиюродная':'пятиюродный'};return words[deg]||`${deg+1}-юродный`}
function kinship(fromId,toId){if(fromId===toId)return 'это вы';const A=ancestorsWithDist(fromId),B=ancestorsWithDist(toId),target=personById(toId);if(A.has(toId))return directAncestorLabel(target,A.get(toId),true);if(B.has(fromId))return directAncestorLabel(target,B.get(fromId),false);const common=[...A.keys()].filter(x=>B.has(x)).sort((x,y)=>(A.get(x)+B.get(x))-(A.get(y)+B.get(y)))[0];if(!common)return 'родственная связь не найдена';const da=A.get(common),db=B.get(common),g=target?.gender;if(da===1&&db===1)return g==='female'?'сестра':'брат';if(da===1&&db===2)return g==='female'?'племянница':'племянник';if(da===2&&db===1)return g==='female'?'тётя':'дядя';const deg=Math.min(da,db)-1,rem=Math.abs(da-db);if(rem===0)return `${cousinWord(deg,g)} ${g==='female'?'сестра':'брат'}`;if(rem===1){if(db>da)return `${cousinWord(deg,g)} ${g==='female'?'племянница':'племянник'}`;return `${cousinWord(deg,g)} ${g==='female'?'тётя':'дядя'}`}return `${cousinWord(deg,g)} родственник (${rem} поколения разницы)`}
function openRelationModal(){const options=state.people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');modal(`<div class="modal-head"><div class="modal-title">Связь между людьми</div><button class="modal-close" data-close>×</button></div><div class="modal-body"><div class="form-grid"><div class="form-group"><label>Первый человек</label><select id="relA">${options}</select></div><div class="form-group"><label>Второй человек</label><select id="relB">${options}</select></div><div class="form-group full"><div id="relResult" class="relation-result">Выберите двух людей</div></div></div></div>`);$('#relA').value=state.viewerPersonId||state.people[0]?.id;$('#relB').value=state.selected||state.people[1]?.id;const calc=()=>{$('#relResult').textContent=`${personById($('#relB').value)?.name}: ${kinship($('#relA').value,$('#relB').value)}`};$('#relA').onchange=calc;$('#relB').onchange=calc;calc();$$('[data-close]').forEach(x=>x.onclick=closeModal)}
function openAccessModal(){const options=state.people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');modal(`<div class="modal-head"><div class="modal-title">Доступ к семейному архиву</div><button class="modal-close" data-close>×</button></div><div class="modal-body"><div class="access-grid"><div class="access-card"><span class="role-badge">Семья</span><h4>Войти для просмотра</h4><p>Семейный код даёт доступ к просмотру. Перед входом можно выбрать себя в древе.</p><div class="form-group"><label>Кто вы в древе</label><select id="familyPerson">${options}</select></div><div class="form-group" style="margin-top:8px"><label>Семейный код</label><input id="familyCode" type="password"></div><button class="btn-secondary" id="familyLoginBtn" style="margin-top:10px">Войти</button></div><div class="access-card"><span class="role-badge">Редактор / администратор</span><h4>Войти в аккаунт</h4><p>Редактирование доступно только тем, кому администратор выдал отдельный аккаунт.</p><div class="form-group"><label>Логин</label><input id="loginUser"></div><div class="form-group" style="margin-top:8px"><label>Пароль</label><input id="loginPass" type="password"></div><button class="btn-primary" id="loginBtn" style="margin-top:10px">Войти</button></div>${state.role==='admin'?`<div class="access-card" style="grid-column:1/-1"><span class="role-badge">Администратор</span><h4>Выдать права</h4><p>Создайте отдельный аккаунт родственнику и выберите его роль.</p><div class="form-grid"><div class="form-group"><label>Логин</label><input id="newUserName"></div><div class="form-group"><label>Пароль</label><input id="newUserPass" type="password"></div><div class="form-group"><label>Роль</label><select id="newUserRole"><option value="viewer">Просмотр</option><option value="editor">Редактор</option></select></div><div class="form-group"><label>Человек в древе</label><select id="newUserPerson"><option value="">Не привязывать</option>${options}</select></div></div><button class="btn-secondary" id="createUserBtn" style="margin-top:10px">Создать аккаунт</button></div>`:''}<div class="access-card" style="grid-column:1/-1"><h4>Первичная настройка</h4><p style="color:var(--muted)">Нужна только один раз после первой публикации, чтобы создать ваш аккаунт администратора и семейный код.</p><button class="btn-secondary" id="setupAdminBtn">Настроить администратора</button></div></div></div>`);$('#familyPerson').value=state.viewerPersonId||state.people[0]?.id;$('#familyLoginBtn').onclick=async()=>{const res=await api.familyLogin($('#familyCode').value,$('#familyPerson').value);if(!res)return toast('Не удалось войти: проверьте семейный код');state.role='viewer';state.viewerPersonId=res.personId;location.reload()};$('#loginBtn').onclick=async()=>{const res=await api.login($('#loginUser').value,$('#loginPass').value);if(!res)return toast('Неверный логин или пароль');location.reload()};if($('#createUserBtn'))$('#createUserBtn').onclick=async()=>{const payload={username:$('#newUserName').value.trim(),password:$('#newUserPass').value,role:$('#newUserRole').value,personId:$('#newUserPerson').value||null};if(!payload.username||!payload.password)return toast('Укажите логин и пароль');const res=await api.createUser(payload);if(!res)return toast('Не удалось создать аккаунт');toast('Аккаунт создан');closeModal()};$('#setupAdminBtn').onclick=openSetupModal;$$('[data-close]').forEach(x=>x.onclick=closeModal)}
function openSetupModal(){closeModal();const options=state.people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');modal(`<div class="modal-head"><div class="modal-title">Первичная настройка</div><button class="modal-close" data-close>×</button></div><div class="modal-body"><p style="color:var(--muted)">Эта форма используется один раз после публикации сайта.</p><div class="form-grid"><div class="form-group"><label>Логин администратора</label><input id="setupUser"></div><div class="form-group"><label>Пароль администратора</label><input id="setupPass" type="password"></div><div class="form-group"><label>Семейный код для просмотра</label><input id="setupFamily" type="password"></div><div class="form-group"><label>Ваш человек в древе</label><select id="setupPerson">${options}</select></div></div><div class="form-actions"><button class="btn-secondary" data-close>Отмена</button><button class="btn-primary" id="setupSave">Создать администратора</button></div></div>`);$('#setupPerson').value=state.viewerPersonId||state.people[0]?.id;$('#setupSave').onclick=async()=>{const res=await api.setup($('#setupUser').value.trim(),$('#setupPass').value,$('#setupFamily').value,$('#setupPerson').value);if(!res)return toast('Настройка не выполнена. Возможно, администратор уже создан.');toast('Администратор создан. Теперь войдите через семейный доступ.');closeModal()};$$('[data-close]').forEach(x=>x.onclick=closeModal)}
function setRole(role){state.role=role;$('#accessBtn').textContent=role==='admin'?'Администратор':role==='editor'?'Редактор':'Семейный просмотр';closeModal();renderProfile()}
function openPeopleView(){state.view='people';$('#treeViewport').classList.add('hidden');$('#emptyView').classList.remove('hidden');$('#emptyView').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><div><div class="stage-title">Люди</div><div class="stage-sub">${state.people.length} карточек в семейном архиве</div></div><button class="primary-btn" style="width:auto" id="peopleNewBtn">＋ Новый человек</button></div><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px">${state.people.map(p=>`<div class="person-card" style="position:relative;left:auto;top:auto;width:auto;min-height:108px" data-open="${p.id}"><div class="portrait">${esc(initials(p.name))}</div><div class="person-name">${esc(p.name)}</div><div class="person-dates">${esc(lifeDates(p))}</div></div>`).join('')}</div>`;$$('[data-open]').forEach(x=>x.onclick=()=>{state.view='tree';showTree();selectPerson(x.dataset.open)});$('#peopleNewBtn').onclick=()=>openPersonModal({})}
function openStoriesView(){state.view='stories';$('#treeViewport').classList.add('hidden');$('#emptyView').classList.remove('hidden');const events=state.events||[];$('#emptyView').innerHTML=`<div class="stage-title">Истории и хроника</div><div class="stage-sub" style="margin-bottom:18px">Семейные события и воспоминания</div><div style="display:grid;gap:12px">${events.map(e=>`<article style="background:var(--paper);border:1px solid color-mix(in srgb,var(--gold) 28%,transparent);border-radius:14px;padding:16px"><div style="color:var(--gold);font-size:11px;letter-spacing:.08em;text-transform:uppercase">${esc(e.date)}</div><h3 style="font:700 18px Georgia,serif;margin:5px 0 8px">${esc(e.title)}</h3>${e.place?`<div style="color:var(--muted);font-size:12px;margin-bottom:7px">${esc(e.place)}</div>`:''}<div style="line-height:1.5">${esc(e.description||'')}</div>${e.participants?`<div style="color:var(--muted);font-size:11px;margin-top:8px">${esc(e.participants)}</div>`:''}</article>`).join('')}</div>`}
function showTree(){state.view='tree';$('#treeViewport').classList.remove('hidden');$('#emptyView').classList.add('hidden');renderPeople()}
function openSimpleView(title,text){state.view=title;$('#treeViewport').classList.add('hidden');$('#emptyView').classList.remove('hidden');$('#emptyView').innerHTML=`<div class="stage-title">${esc(title)}</div><p>${esc(text)}</p>`}
function clampWorldOffset(){
  const vp=$('#treeViewport');
  if(!vp)return;
  const {w,h}=state.worldSize||{w:1800,h:1000};
  const scaledW=w*state.scale, scaledH=h*state.scale;
  const vw=vp.clientWidth, vh=vp.clientHeight;
  if(scaledW<=vw){
    state.offset.x=Math.round((vw-scaledW)/2);
  }else{
    const minX=vw-scaledW;
    state.offset.x=Math.min(0,Math.max(minX,state.offset.x));
  }
  if(scaledH<=vh){
    state.offset.y=Math.round((vh-scaledH)/2);
  }else{
    const minY=vh-scaledH;
    state.offset.y=Math.min(0,Math.max(minY,state.offset.y));
  }
}
function updateWorldTransform(){clampWorldOffset();const w=$('#treeWorld');w.style.transform=`translate(${state.offset.x}px,${state.offset.y}px) scale(${state.scale})`;const v=Math.round(state.scale*100)+'%';$('#zoomValue').textContent=v;if($('#zoomValueCanvas'))$('#zoomValueCanvas').textContent=v}
function centerOnPerson(id,scale=.82){const vp=$('#treeViewport');if(!vp)return;const layout=layoutPeople(),pt=layout.pos.get(id);if(!pt)return;state.scale=scale;state.offset={x:Math.round(vp.clientWidth/2-(pt.x+CARD_W/2)*scale),y:Math.round(Math.max(28,vp.clientHeight*.22)-(pt.y+CARD_H/2)*scale)};updateWorldTransform()}
function centerOverview(){const vp=$('#treeViewport');if(!vp)return;const layout=layoutPeople();const pad=22;const sx=(vp.clientWidth-pad*2)/layout.w,sy=(vp.clientHeight-pad*2)/layout.h;state.scale=Math.max(.12,Math.min(.78,Math.min(sx,sy)));state.offset={x:Math.round((vp.clientWidth-layout.w*state.scale)/2),y:Math.round((vp.clientHeight-layout.h*state.scale)/2)};updateWorldTransform()}
function fitTreeView(){const vp=$('#treeViewport');if(!vp||vp.classList.contains('hidden'))return;const {w,h}=state.worldSize||{w:1800,h:1000};const vw=Math.max(320,vp.clientWidth),vh=Math.max(320,vp.clientHeight);const pad=44;const sx=(vw-pad*2)/w,sy=(vh-pad*2)/h;state.scale=Math.max(.12,Math.min(.78,Math.min(sx,sy)));state.offset={x:Math.round((vw-w*state.scale)/2),y:Math.round((vh-h*state.scale)/2)};updateWorldTransform()}
function renderAll(){renderBranches();if(state.view==='tree')renderPeople();renderProfile();applyTheme(state.theme);$('#accessBtn').textContent=state.role==='admin'?'Администратор':state.role==='editor'?'Редактор':state.role==='viewer'?'Семейный просмотр':'Семейный доступ'}
async function init(){const remote=await api.bootstrap();let data;if(remote?.people?.length){data=remote;state.role=remote.auth?.role||'viewer';state.viewerPersonId=remote.auth?.personId||'P053'}else{const local=localStorage.getItem('family-local-data');if(local){try{data=JSON.parse(local)}catch{}}if(!data){data=window.__INITIAL_DATA__||await fetch('/data.json').then(r=>r.json())}}state.people=data.people||[];state.relations=data.relations||[];state.events=data.events||[];state.relations.forEach(r=>{if(r.type==='partner'&&/перв(ый|ая|ое)\s+(муж|жена|брак)/i.test(r.note||''))r.status='ended'});state.selected=null;renderAll();bindUI();requestAnimationFrame(()=>requestAnimationFrame(centerOverview));}
function bindUI(){applyTheme(state.theme);$('#themeSelect').onchange=e=>applyTheme(e.target.value);$('#newPersonBtn').onclick=()=>openPersonModal({});$('#relationBtn').onclick=openRelationModal;$('#accessBtn').onclick=openAccessModal;$('#profileClose').onclick=closeProfile;$('#mainTreeBtn').onclick=()=>{state.branch=null;state.selected=null;$('#stageSub').textContent='Тестовая нагрузка · 150 условных человек';renderProfile();showTree();requestAnimationFrame(centerOverview)};$('#resetViewBtn').onclick=()=>state.branch?fitTreeView():centerOverview;const zin=()=>{state.scale=Math.min(1.45,state.scale+.1);updateWorldTransform()},zout=()=>{state.scale=Math.max(.12,state.scale-.1);updateWorldTransform()};$('#zoomIn').onclick=zin;$('#zoomOut').onclick=zout;$('#zoomInCanvas').onclick=zin;$('#zoomOutCanvas').onclick=zout;$('#fitCanvas').onclick=fitTreeView;$('#treeViewport').addEventListener('wheel',e=>{e.preventDefault();state.scale=Math.max(.12,Math.min(1.45,state.scale+(e.deltaY<0?.06:-.06)));updateWorldTransform()},{passive:false});const vp=$('#treeViewport');vp.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('.person-card,.canvas-tools'))return;e.preventDefault();window.getSelection()?.removeAllRanges();state.drag=true;state.last={x:e.clientX,y:e.clientY};vp.classList.add('dragging');vp.setPointerCapture(e.pointerId)});vp.addEventListener('pointermove',e=>{if(!state.drag)return;e.preventDefault();state.offset.x+=e.clientX-state.last.x;state.offset.y+=e.clientY-state.last.y;state.last={x:e.clientX,y:e.clientY};updateWorldTransform()});const stop=()=>{state.drag=false;vp.classList.remove('dragging')};vp.addEventListener('pointerup',stop);vp.addEventListener('pointercancel',stop);vp.addEventListener('dragstart',e=>e.preventDefault());vp.addEventListener('selectstart',e=>e.preventDefault());vp.addEventListener('mousedown',e=>{if(!e.target.closest('input,textarea,select'))e.preventDefault()});document.addEventListener('click',e=>{if(!e.target.closest('.context-menu'))closeContext()});const search=e=>{const q=e.target.value.trim().toLowerCase();if(!q)return;const p=state.people.find(x=>x.name.toLowerCase().includes(q));if(p){state.branch=null;showTree();selectPerson(p.id);requestAnimationFrame(()=>centerOnPerson(p.id,.8))}};$('#globalSearch').addEventListener('change',search);$('#sideSearch').addEventListener('change',search);$$('.nav-btn').forEach(b=>b.onclick=()=>{$$('.nav-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');const v=b.dataset.view;if(v==='tree')showTree();else if(v==='people')openPeopleView();else if(v==='stories')openStoriesView();else if(v==='photos')openSimpleView('Фото','Здесь будет семейный фотоархив с привязкой фотографий к людям.');else openSimpleView('Документы','Здесь будут семейные документы и архивные материалы.')});$('#myLineBtn').onclick=()=>{state.branch='__lineage__';state.selected=null;$('#stageSub').textContent='Моя линия';renderProfile();showTree();requestAnimationFrame(fitTreeView)};$('#editModeBtn').onclick=()=>toast(state.role==='viewer'?'У вас только права просмотра':'Редактирование доступно через карточки и правый клик');let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(fitTreeView,140)})}
init();
